name: build-solc

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get latest version
        run: |
          echo "=== Fetching version list from ethereum/solc-bin ==="
          wget -q -O /tmp/list.txt https://raw.githubusercontent.com/ethereum/solc-bin/gh-pages/bin/list.txt

          echo "=== First 5 entries in list.txt ==="
          head -n 5 /tmp/list.txt

          echo ""
          echo "=== Parsing latest version ==="
          raw_version=$(head -n 1 /tmp/list.txt)
          echo "Raw version string: $raw_version"

          last_version=$(echo "$raw_version" | sed 's/soljson-//' | sed 's/.js//')
          echo "Parsed version: $last_version"

          commit_hash=$(echo "$last_version" | awk -F "commit." '{ print $2 }')
          echo "Commit hash: $commit_hash"

          is_nightly="false"
          if [[ $last_version == *"nightly"* ]]; then
            is_nightly="true"
          fi
          echo "Is nightly build: $is_nightly"

          echo ""
          echo "=== Setting environment variables ==="
          echo "SOLC_VERSION=${last_version}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${commit_hash}" >> $GITHUB_ENV
          echo "IS_NIGHTLY=${is_nightly}" >> $GITHUB_ENV
          echo "SOLC_VERSION=${last_version}"
          echo "COMMIT_HASH=${commit_hash}"
          echo "IS_NIGHTLY=${is_nightly}"

      - name: Prerequisites
        run: |
          echo "=== Installing build dependencies ==="
          sudo apt-get update
          sudo apt-get install -y git cmake build-essential cvc4 curl wget libc6-dev libclang-dev pkg-config unzip gcc g++ libboost-all-dev

          echo ""
          echo "=== Installed versions ==="
          cmake --version
          g++ --version | head -n 1
          git --version

      - name: Checkout
        uses: actions/checkout@v3
        with:
          repository: ethereum/solidity
          submodules: 'recursive'
          fetch-depth: 0

      - name: Checkout hash
        run: |
          echo "=== Current git status ==="
          echo "Current branch: $(git branch --show-current)"
          echo "Current commit: $(git rev-parse HEAD)"

          echo ""
          echo "=== Checking out commit: $COMMIT_HASH ==="
          git checkout ${COMMIT_HASH}

          echo ""
          echo "=== After checkout ==="
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Commit message: $(git log -1 --pretty=%s)"
          echo "Commit date: $(git log -1 --pretty=%cd)"

          echo ""
          echo "=== Checking prerelease.txt existence ==="
          if [[ -f prerelease.txt ]]; then
            echo "prerelease.txt EXISTS with content:"
            cat prerelease.txt
          else
            echo "prerelease.txt DOES NOT EXIST"
          fi

      - name: Build
        run: |
          echo "=== Build configuration ==="
          echo "SOLC_VERSION: $SOLC_VERSION"
          echo "IS_NIGHTLY: $IS_NIGHTLY"

          mkdir -p build
          cd build

          echo ""
          echo "=== Handling prerelease.txt ==="
          if [[ $IS_NIGHTLY == "false" ]]; then
            echo "Non-nightly build detected, creating prerelease.txt"
            touch ../prerelease.txt
            echo "prerelease.txt created"
          else
            echo "Nightly build detected, not creating prerelease.txt"
          fi

          echo ""
          echo "=== Checking prerelease.txt after handling ==="
          if [[ -f ../prerelease.txt ]]; then
            echo "prerelease.txt EXISTS"
            ls -la ../prerelease.txt
          else
            echo "prerelease.txt DOES NOT EXIST"
          fi

          echo ""
          echo "=== Running cmake ==="
          echo "CMAKE_BUILD_TYPE=Release"
          echo "USE_Z3=OFF"
          echo "USE_CVC4=OFF"
          cmake .. -DCMAKE_BUILD_TYPE=Release -DUSE_Z3=OFF -DUSE_CVC4=OFF

          echo ""
          echo "=== Starting build with make -j2 ==="
          make -j2

          echo ""
          echo "=== Build complete ==="
          ls -la solc/solc

      - name: Show version
        run: |
          echo "=== Built solc binary information ==="
          ls -la ./build/solc/solc
          file ./build/solc/solc

          echo ""
          echo "=== solc --version output ==="
          ./build/solc/solc --version

          echo ""
          echo "=== Parsing version string ==="
          version_output=$(./build/solc/solc --version)
          echo "Full output:"
          echo "$version_output"

          echo ""
          echo "=== Checking for .mod suffix ==="
          if echo "$version_output" | grep -q "\.mod\."; then
            echo "WARNING: Version contains .mod suffix (dirty build)"
          else
            echo "OK: Version does not contain .mod suffix"
          fi

          echo ""
          echo "=== Expected vs Actual ==="
          echo "Expected version: $SOLC_VERSION"
          echo "Actual version from binary:"
          ./build/solc/solc --version | grep "Version:"
